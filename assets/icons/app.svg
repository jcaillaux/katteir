<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- The app icon: a Norse round shield painted with the Web of Wyrd, the sleeping
       ginger cat in front. CC BY-NC 4.0 (assets/LICENSE.md), drawn for Katteir. -->
  <defs>
    <radialGradient id="paint" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#3a609a"/>
      <stop offset="1" stop-color="#2b4a7c"/>
    </radialGradient>
    <radialGradient id="fur" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#f5aa68"/>
      <stop offset="1" stop-color="#dd8039"/>
    </radialGradient>
  </defs>

  <!-- The shield: painted field, the Web of Wyrd, iron rim and rivets. The rim
       covers the web's corners, so nothing needs clipping (Qt's SVG can't clip). -->
  <circle cx="64" cy="64" r="52" fill="url(#paint)"/>
  <g fill="none" stroke="#05070d" stroke-opacity="0.75" stroke-width="2.5" stroke-linecap="round">
    <path d="M24 24 H104 M24 64 H104 M24 104 H104"/>
