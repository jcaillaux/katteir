    <path d="M24 24 L104 104 M104 24 L24 104"/>
    <path d="M64 24 L104 64 L64 104 L24 64 Z"/>
  </g>
  <circle cx="64" cy="64" r="53" fill="none" stroke="#565d68" stroke-width="8"/>
  <circle cx="64" cy="64" r="57" fill="none" stroke="#3b2414" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="49" fill="none" stroke="#3b2414" stroke-width="2.5"/>
  <g fill="#c9ced6">
    <circle cx="64" cy="11" r="2.2"/><circle cx="64" cy="117" r="2.2"/>
    <circle cx="11" cy="64" r="2.2"/><circle cx="117" cy="64" r="2.2"/>
    <circle cx="26.5" cy="26.5" r="2.2"/><circle cx="101.5" cy="101.5" r="2.2"/>
    <circle cx="26.5" cy="101.5" r="2.2"/><circle cx="101.5" cy="26.5" r="2.2"/>
  </g>

  <!-- The cat's head. -->
  <g transform="translate(64 71) scale(0.8) translate(-64 -66)">
