# The ginger cat: AI footage, cut out by tools/cutout.py and encoded by
# tools/encode.sh (`make cat-ginger` rebuilds both clips from the source,
# which stays local in dev-assets/). Generated on 2026-09-14 with ByteDance
# Seedance 2.5 on easemate.ai, text to video from prompt.txt, no reference
# image. EaseMate's terms (updated 2025-06-24) leave generated content with
# the user who made it; Katteir's contributors dedicate these clips to the
# public domain.
width = 1280
height = 720
credits = "Katteir contributors; footage generated with ByteDance Seedance 2.5 on easemate.ai from prompt.txt, cut out by tools/cutout.py"
license = "CC0-1.0"

[entry]
file = "entry.ivf"
fps = 24
frames = 424

[sleep]
file = "sleep.ivf"
fps = 12
frames = 112
