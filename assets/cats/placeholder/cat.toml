# The bundled placeholder cat: a flat ginger blob with ears and a tail, drawn
# by ffmpeg's geq filter in tools/placeholder.sh (no source footage).
width = 640
height = 360
credits = "catnap contributors, generated by tools/placeholder.sh"
license = "CC0-1.0"

[entry]
file = "entry.ivf"
fps = 15
frames = 30

[sleep]
file = "sleep.ivf"
fps = 15
frames = 60
