# The .deb, built twice (CLAUDE.md §6). A package needs the glibc it was
# built against or newer, so each Ubuntu container sets a baseline:
# ubuntu:26.04 has glibc 2.43, the newest; ubuntu:22.04 has 2.35, which
# covers Ubuntu 22.04+, Mint 21+, Debian 12+ and current Fedora and Arch.
# It runs on pushes to main and on v* tags, and by hand (Actions → deb →
# Run workflow). A v* tag also drafts a GitHub release (the release job).
name: deb

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    # Not when a push changes only Markdown files, except the assets'
    # licence, which the package ships. Tags ignore path filters.
    paths:
      - "**"
      - "!**.md"
      - "assets/LICENSE.md"

# A newer push to the same branch cancels the run still going.
concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deb:
    name: .deb (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:26.04", "ubuntu:22.04"]
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # What `make check-tools` asks for, plus xz for nasm's tarball.
      - name: Build packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config python3-venv xz-utils

      - uses: actions/checkout@v7

      - name: Rust (stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # Building them takes minutes. Their versions are in the Makefile.
      - name: Cache cargo-packager and cargo-about
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-packager
            ~/.cargo/bin/cargo-about
          key: packaging-tools-${{ matrix.image }}-${{ hashFiles('Makefile') }}

      - run: make packaging-tools

      - run: make deb

      # Installs the package in this container: its Depends must resolve on
      # this Ubuntu, and must bring every library the binary loads at run
      # time (GL/EGL, Wayland, X11...), which dpkg can't see.
      - name: Check the package
        id: check
        run: |
          debs=(target/release/*.deb)
          test "${#debs[@]}" -eq 1
          test -f "${debs[0]}"
          apt-get install -y --no-install-recommends "./${debs[0]}"
          bin=$(dpkg -L "$(dpkg-deb -f "${debs[0]}" Package)" | grep '^/usr/bin/.')
          test -x "$bin"
          libs=$(strings -n 5 "$bin" | grep -oE 'lib[A-Za-z0-9_+-]+\.so\.[0-9]+' | sort -u)
          test -n "$libs"
          installed=$(ldconfig -p | awk 'NR > 1 { print $1 }')
          missing=0
          for lib in $libs; do
            grep -qxF "$lib" <<< "$installed" || { echo "not installed: $lib"; missing=1; }
          done
          test "$missing" -eq 0
          glibc=$(sed -n 's/^libc6 (>= \(.*\))$/\1/p' target/deb-depends)
          test -n "$glibc"
          echo "glibc=$glibc" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.image }}: ${debs[0]##*/} needs glibc $glibc or newer." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: deb-glibc${{ steps.check.outputs.glibc }}
          path: target/release/*.deb
          if-no-files-found: error

  # A v* tag, once both packages are built, makes a draft release with the
  # oldest-glibc package: it installs everywhere the others do, so nobody has
  # to choose. The notes come from .github/release-notes.md. Publishing the
  # draft is done by hand, after a look.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: deb-glibc*
          path: dist

      - name: Check the tag and pick the package
        id: package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
          glibc=$(ls dist | sed -n 's/^deb-glibc//p' | sort -V | head -n 1)
          test -n "$glibc"
          debs=(dist/deb-glibc"$glibc"/*.deb)
          test "${#debs[@]}" -eq 1
          test -f "${debs[0]}"
          package="$(basename "${debs[0]}" .deb)_glibc$glibc.deb"
          mkdir release
          cp "${debs[0]}" "release/$package"
          (cd release && sha256sum "$package" > SHA256SUMS)
          sed -e "s/@VERSION@/$version/g" -e "s/@GLIBC@/$glibc/g" -e "s/@PACKAGE@/$package/g" \
            .github/release-notes.md > notes.md
          if grep -n '@[A-Z]*@' notes.md; then exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Katteir $VERSION" --notes-file notes.md release/*
