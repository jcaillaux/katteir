# Third-party notices (`make notices`, cargo-about 0.9.2). The licences we
# accept for the crates in the binary, most preferred first: where a crate
# offers a choice, the first one listed here is the one it's used under
# (MIT before Apache-2.0, Slint's royalty-free licence rather than the GPL).
accepted = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "MPL-2.0",
    "LicenseRef-Slint-Royalty-free-2.0",
]
# Only what goes into the Linux binary.
targets = ["x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Not our own crate (publish = false): these are third-party notices.
[private]
ignore = true

# The Slint crates, used under LicenseRef-Slint-Royalty-free-2.0, keep that
# licence's text in LICENSES/, where cargo-about doesn't look. It can't be
# told either: cargo-about 0.9.2's LicenseRef filter (generate.rs) skips a
# clarified file that names the LicenseRef instead of keeping it, so a
# `clarify` never takes. Their licence is accepted, so --fail passes, but
# they're dropped from the output with a warning, and `make notices`
# appends their licence itself.
